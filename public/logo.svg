<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="globeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="30%" stop-color="#2563EB"/>
      <stop offset="70%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1D4ED8" flood-opacity="0.3"/>
    </filter>
    <filter id="textShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Glow & Orbital Ring Behind -->
  <path d="M 80 340 C 40 280, 70 180, 160 110 C 230 55, 330 50, 410 100 C 420 106, 425 118, 415 125 C 405 130, 395 120, 385 115 C 315 75, 230 80, 175 125 C 100 185, 75 270, 110 320 Z" fill="url(#ringGrad)" opacity="0.95" filter="url(#dropGlow)" />
  
  <!-- Four-point star on ring -->
  <path d="M 300 70 Q 300 110 270 110 Q 300 110 300 150 Q 300 110 330 110 Q 300 110 300 70 Z" fill="#2563EB"/>

  <!-- Globe Core Sphere -->
  <circle cx="250" cy="250" r="140" fill="url(#globeGrad)"/>
  <circle cx="250" cy="250" r="140" fill="none" stroke="#2563EB" stroke-width="6"/>

  <!-- Globe Latitude Lines -->
  <ellipse cx="250" cy="250" rx="140" ry="110" fill="none" stroke="#0284C7" stroke-width="3" stroke-dasharray="0" opacity="0.85"/>
  <ellipse cx="250" cy="250" rx="140" ry="70" fill="none" stroke="#0284C7" stroke-width="3" opacity="0.85"/>
  <ellipse cx="250" cy="250" rx="140" ry="25" fill="none" stroke="#0284C7" stroke-width="3" opacity="0.85"/>

  <!-- Globe Longitude Lines -->
  <ellipse cx="250" cy="250" rx="110" ry="140" fill="none" stroke="#0284C7" stroke-width="3" opacity="0.85"/>
  <ellipse cx="250" cy="250" rx="65" ry="140" fill="none" stroke="#0284C7" stroke-width="3" opacity="0.85"/>
  <line x1="250" y1="110" x2="250" y2="390" stroke="#0284C7" stroke-width="3" opacity="0.85"/>
  <line x1="110" y1="250" x2="390" y2="250" stroke="#0284C7" stroke-width="3" opacity="0.85"/>

  <!-- Foreground Orbital Swoosh -->
  <path d="M 105 340 C 130 380, 200 405, 290 380 C 370 355, 410 300, 415 230 C 420 180, 395 140, 380 120 C 390 125, 410 160, 410 215 C 410 280, 360 350, 275 385 C 190 420, 115 390, 85 345 Z" fill="url(#ringGrad)" filter="url(#dropGlow)" />
  
  <!-- Lower Star -->
  <path d="M 240 375 Q 240 420 210 420 Q 240 420 240 465 Q 240 420 270 420 Q 240 420 240 375 Z" fill="#2563EB"/>

  <!-- Bold Red/White 3D Typography "TECH PROMOTION BD" -->
  <g filter="url(#textShadow)" transform="rotate(-7 250 250)">
    <!-- White outer stroke / sticker effect -->
    <text x="250" y="240" font-family="'Impact', 'Arial Black', sans-serif" font-size="39" font-weight="900" text-anchor="middle" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round" letter-spacing="1">TECH PROMOTION</text>
    <text x="250" y="240" font-family="'Impact', 'Arial Black', sans-serif" font-size="39" font-weight="900" text-anchor="middle" fill="url(#textGrad)" letter-spacing="1">TECH PROMOTION</text>
    
    <text x="250" y="295" font-family="'Impact', 'Arial Black', sans-serif" font-size="46" font-weight="900" text-anchor="middle" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" letter-spacing="2">BD</text>
    <text x="250" y="295" font-family="'Impact', 'Arial Black', sans-serif" font-size="46" font-weight="900" text-anchor="middle" fill="url(#textGrad)" letter-spacing="2">BD</text>
  </g>
</svg>
